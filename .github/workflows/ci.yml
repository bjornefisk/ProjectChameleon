name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-test:
    name: Verify and test
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          make setup PYTHON_BOOTSTRAP=python3.11
      - name: Verify repository
        run: make verify

      - name: Run tests
        run: make test
      - name: Record native renderer qualification
        run: |
          uname -a
          .venv/bin/python -m pip freeze
          .venv/bin/python -m unittest discover \
            -s chameleon/tests/renderer -t . -p 'test_renderer_golden.py' -v

      - name: Verify Docker Buildx
        run: docker buildx version

      - name: Build linux/amd64 Docker image
        run: make docker-build

      - name: Verify Docker image architecture
        run: test "$(docker inspect chameleon-stage1 --format '{{.Os}}/{{.Architecture}}')" = "linux/amd64"
      - name: Record locked package provenance
        run: |
          docker run --rm --network none --entrypoint sh chameleon-stage1 -c '
            set -eu
            for path in \
              /app/provenance/apt-snapshot-evidence.json \
              /app/provenance/apt-packages.lock \
              /app/provenance/apt-packages.sha256 \
              /app/provenance/dpkg-query.txt \
              /app/provenance/python-requirements.lock \
              /app/provenance/renderer-build.lock \
              /app/provenance/renderer-artifact.json \
              /app/provenance/wheelhouse-manifest.json \
              /app/provenance/pip-inspect.json \
              /app/provenance/pip-freeze.txt; do
              test -s "$path"
            done
            printf "apt package closure:\n"
            cat /app/provenance/dpkg-query.txt
            printf "installed Python distributions:\n"
            cat /app/provenance/pip-freeze.txt
            printf "provenance_sha256:\n"
            sha256sum /app/provenance/apt-snapshot-evidence.json \
              /app/provenance/apt-packages.lock /app/provenance/apt-packages.sha256 \
              /app/provenance/dpkg-query.txt \
              /app/provenance/python-requirements.lock \
              /app/provenance/renderer-build.lock \
              /app/provenance/renderer-artifact.json \
              /app/provenance/wheelhouse-manifest.json \
              /app/provenance/pip-inspect.json /app/provenance/pip-freeze.txt
          '

      - name: Record Docker image provenance
        run: |
          docker inspect chameleon-stage1 \
            --format 'image_id={{.Id}} architecture={{.Os}}/{{.Architecture}} repo_digests={{json .RepoDigests}}'
      - name: Generate Docker image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: chameleon-stage1
          format: spdx-json
          output-file: ${{ runner.temp }}/chameleon-stage1.sbom.spdx.json
          syft-version: v1.42.3
          artifact-name: chameleon-stage1-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false
          dependency-snapshot: false
      - name: Record Docker image SBOM
        run: |
          sbom="${{ runner.temp }}/chameleon-stage1.sbom.spdx.json"
          test -s "$sbom"
          printf "sbom_sha256="
          sha256sum "$sbom" | cut -d' ' -f1
      - name: Record packaged asset and font hashes
        run: |
          docker run --rm --network none --entrypoint sh chameleon-stage1 -c '
            set -eu
            for root in /app/brand_kit/assets /app/brand_kit/fonts; do
              test -d "$root"
              printf "root=%s\n" "$root"
              find "$root" -type f -print0 | sort -z | xargs -0 -r sha256sum
            done
          '
      - name: Verify clean-cache amd64 rebuild
        run: |
          docker buildx build --no-cache --platform linux/amd64 --load \
            -t chameleon-stage1-clean chameleon/
          test "$(docker inspect chameleon-stage1-clean --format '{{.Os}}/{{.Architecture}}')" = "linux/amd64"

      - name: Run native amd64 offline smoke
        shell: bash
        run: |
          set -o pipefail
          test "$(uname -m)" = "x86_64"
          make clean
          set +e
          make docker-test 2>&1 | tee "$RUNNER_TEMP/docker-test.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          grep -F "[chameleon_sample_level1_warmup.json] status=SUCCESS" "$RUNNER_TEMP/docker-test.log"
          grep -F "[chameleon_sample_level2_core.json] status=SUCCESS" "$RUNNER_TEMP/docker-test.log"
          grep -F "[chameleon_sample_level3_advanced.json] status=SUCCESS" "$RUNNER_TEMP/docker-test.log"
          for path in \
            chameleon/output/chameleon_sample_level1_warmup_output.json \
            chameleon/output/chameleon_sample_level1_warmup_output.png \
            chameleon/output/.chameleon_sample_level1_warmup_output.commit \
            chameleon/output/chameleon_sample_level2_core_output.json \
            chameleon/output/chameleon_sample_level2_core_output.png \
            chameleon/output/.chameleon_sample_level2_core_output.commit \
            chameleon/output/chameleon_sample_level3_advanced_output.json \
            chameleon/output/chameleon_sample_level3_advanced_output.png \
            chameleon/output/.chameleon_sample_level3_advanced_output.commit; do
            test ! -L "$path"
            test -f "$path"
          done
          test -z "$(find chameleon/output -maxdepth 1 -type l -print -quit)"
      - name: Run repeated native amd64 offline synthetic qualification
        shell: bash
        env:
          NATIVE_AUDIT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          NATIVE_AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONHASHSEED: "0"
          TZ: UTC
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          audit_root="$RUNNER_TEMP/native-synthetic-audit"
          mkdir -p "$audit_root"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin "$NATIVE_AUDIT_BASE_SHA"
          origin_main="$(git rev-parse origin/main)"
          {
            printf 'origin_main_commit=%s\n' "$origin_main"
            printf 'base_commit=%s\n' "$NATIVE_AUDIT_BASE_SHA"
            printf 'audit_head_commit=%s\n' "$NATIVE_AUDIT_HEAD_SHA"
            printf 'checkout_commit=%s\n' "$(git rev-parse HEAD)"
            printf 'checkout_tree_sha=%s\n' "$(git rev-parse HEAD^{tree})"
            printf 'origin_main_tree_sha=%s\n' "$(git rev-parse origin/main^{tree})"
            printf 'origin_main_chameleon_tree_sha=%s\n' "$(git rev-parse origin/main:chameleon)"
            printf 'audited_chameleon_tree_sha=%s\n' "$(git rev-parse HEAD:chameleon)"
            printf 'base_chameleon_tree_sha=%s\n' "$(git rev-parse "$NATIVE_AUDIT_BASE_SHA:chameleon")"
          } > "$audit_root/source-tree.txt"
          git diff --name-status origin/main HEAD > "$audit_root/source-tree-diff.txt"
          run_audit() {
            local run_number="$1"
            local log="$audit_root/run-$run_number.log"
            local workspace started_at finished_at started_ns finished_ns status
            started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            started_ns="$(date +%s%N)"
            set +e
            .venv/bin/python scripts/run_synthetic_docker.py 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            finished_ns="$(date +%s%N)"
            finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'started_at_utc=%s\nfinished_at_utc=%s\nelapsed_ns=%s\nexit_code=%s\n' \
              "$started_at" "$finished_at" "$((finished_ns - started_ns))" "$status" \
              > "$audit_root/run-$run_number.timing"
            workspace="$(awk -F': ' '$1 == "Preserved artifacts" { path=$2 } END { print path }' "$log")"
            if [ -n "$workspace" ]; then
              mkdir -p "$audit_root/run-$run_number"
              cp -a "$workspace/input" "$audit_root/run-$run_number/"
              cp -a "$workspace/output" "$audit_root/run-$run_number/"
              cp "$log" "$audit_root/run-$run_number/runner.log"
            fi
            test "$status" -eq 0
            grep -F "Image architecture: linux/amd64" "$log"
            grep -F "Task statuses: 18/18 SUCCESS" "$log"
            grep -F "Committed JSON/PNG pairs: 18/18" "$log"
            grep -F "In-image serialized responses hard-validated: 18/18" "$log"
            grep -F "AUDIT_PAIRS=18" "$log"
            grep -F "AUDIT_VALIDATED=18" "$log"
          }
          image_before="$(docker image inspect --format '{{.Id}}' chameleon-stage1)"
          run_audit 1
          image_after_run_1="$(docker image inspect --format '{{.Id}}' chameleon-stage1)"
          run_audit 2
          image_after_run_2="$(docker image inspect --format '{{.Id}}' chameleon-stage1)"
          test "$image_before" = "$image_after_run_1"
          test "$image_before" = "$image_after_run_2"
          {
            printf 'before=%s\n' "$image_before"
            printf 'after_run_1=%s\n' "$image_after_run_1"
            printf 'after_run_2=%s\n' "$image_after_run_2"
          } > "$audit_root/image-digests.txt"
      - name: Compare native audit hashes and write manifest
        if: always()
        shell: bash
        env:
          NATIVE_AUDIT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          NATIVE_AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONHASHSEED: "0"
          TZ: UTC
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          audit_root="$RUNNER_TEMP/native-synthetic-audit"
          mkdir -p "$audit_root"
          complete=true
          for run_number in 1 2; do
            run_root="$audit_root/run-$run_number"
            mkdir -p "$run_root"
            for kind in input output; do
              hash_file="$audit_root/run-$run_number-$kind.sha256"
              if [ -d "$run_root/$kind" ]; then
                (cd "$run_root/$kind" && find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 -r sha256sum) > "$hash_file"
              else
                : > "$hash_file"
                complete=false
              fi
            done
            input_count="$(find "$run_root/input" -maxdepth 1 -type f -name '*.json' -print 2>/dev/null | wc -l | tr -d ' ')"
            json_count="$(find "$run_root/output" -maxdepth 1 -type f -name '*_output.json' -print 2>/dev/null | wc -l | tr -d ' ')"
            png_count="$(find "$run_root/output" -maxdepth 1 -type f -name '*_output.png' -print 2>/dev/null | wc -l | tr -d ' ')"
            marker_count="$(find "$run_root/output" -maxdepth 1 -type f -name '.*_output.commit' -print 2>/dev/null | wc -l | tr -d ' ')"
            if [ "$input_count" != 18 ] || [ "$json_count" != 18 ] || [ "$png_count" != 18 ] || [ "$marker_count" != 18 ]; then
              complete=false
            fi
            printf 'run_%s_input_json=%s\nrun_%s_output_json=%s\nrun_%s_output_png=%s\nrun_%s_commit_markers=%s\n' \
              "$run_number" "$input_count" "$run_number" "$json_count" \
              "$run_number" "$png_count" "$run_number" "$marker_count" \
              >> "$audit_root/file-counts.txt"
          done
          if diff -u "$audit_root/run-1-input.sha256" "$audit_root/run-2-input.sha256" > "$audit_root/input-hash-diff.txt"; then
            input_hashes_match=true
          else
            input_hashes_match=false
          fi
          if diff -u "$audit_root/run-1-output.sha256" "$audit_root/run-2-output.sha256" > "$audit_root/output-hash-diff.txt"; then
            output_hashes_match=true
          else
            output_hashes_match=false
          fi
          origin_main="$(git rev-parse origin/main 2>/dev/null || printf 'unavailable')"
          {
            printf 'origin_main_commit=%s\n' "$origin_main"
            printf 'base_commit=%s\n' "$NATIVE_AUDIT_BASE_SHA"
            printf 'audit_head_commit=%s\n' "$NATIVE_AUDIT_HEAD_SHA"
            printf 'checkout_commit=%s\n' "$(git rev-parse HEAD 2>/dev/null || printf 'unavailable')"
            printf 'checkout_tree_sha=%s\n' "$(git rev-parse 'HEAD^{tree}' 2>/dev/null || printf 'unavailable')"
            printf 'origin_main_tree_sha=%s\n' "$(git rev-parse 'origin/main^{tree}' 2>/dev/null || printf 'unavailable')"
            printf 'origin_main_chameleon_tree_sha=%s\n' "$(git rev-parse origin/main:chameleon 2>/dev/null || printf 'unavailable')"
            printf 'audited_chameleon_tree_sha=%s\n' "$(git rev-parse HEAD:chameleon 2>/dev/null || printf 'unavailable')"
            printf 'base_chameleon_tree_sha=%s\n' "$(git rev-parse "$NATIVE_AUDIT_BASE_SHA:chameleon" 2>/dev/null || printf 'unavailable')"
            printf '\n[changes from origin/main to audited checkout]\n'
            cat "$audit_root/source-tree-diff.txt" 2>/dev/null || git diff --name-status origin/main HEAD 2>/dev/null || true
            printf '\n[run commands]\n'
            printf 'image_build=make docker-build\n'
            printf 'audit_command=PYTHONHASHSEED=0 TZ=UTC LC_ALL=C.UTF-8 .venv/bin/python scripts/run_synthetic_docker.py (run twice)\n'
            printf 'independent_validation=run_synthetic_docker.py performs a separate offline container audit with validate_response() for all 18 responses per run\n'
            printf '\n[runner environment]\nPYTHONHASHSEED=%s\nTZ=%s\nLC_ALL=%s\n' \
              "$PYTHONHASHSEED" "$TZ" "$LC_ALL"
            printf '\n[architecture]\nhost=%s\ndocker_daemon=%s\nimage=%s\n' \
              "$(uname -m)" \
              "$(docker info --format '{{.Architecture}}' 2>/dev/null || printf 'unavailable')" \
              "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' chameleon-stage1 2>/dev/null || printf 'unavailable')"
            printf 'container_config_env=%s\nruntime_network=none\nruntime_platform=linux/amd64\n' \
              "$(docker image inspect --format '{{json .Config.Env}}' chameleon-stage1 2>/dev/null || printf 'unavailable')"
            printf '\n[image digest]\n'
            cat "$audit_root/image-digests.txt" 2>/dev/null || printf 'unavailable\n'
            printf '\n[timings and case validation]\n'
            for run_number in 1 2; do
              printf '\nrun_%s_timing:\n' "$run_number"
              cat "$audit_root/run-$run_number.timing" 2>/dev/null || printf 'unavailable\n'
              printf 'run_%s_runner_summary:\n' "$run_number"
              grep -E 'Engine container wall time:|In-image audit wall time:|Total container wall time:|Engine Docker command:|Audit Docker command:|Task statuses:|Committed JSON/PNG pairs:|In-image serialized responses hard-validated:' \
                "$audit_root/run-$run_number.log" 2>/dev/null || true
              printf 'run_%s_independent_validation:\n' "$run_number"
              cat "$audit_root/run-$run_number-independent-validation.log" 2>/dev/null || printf 'unavailable\n'
            done
            printf '\n[file counts]\n'
            cat "$audit_root/file-counts.txt"
            printf '\n[input and output hashes, relative to each run directory]\n'
            for run_number in 1 2; do
              printf '\nrun_%s_inputs_sha256:\n' "$run_number"
              cat "$audit_root/run-$run_number-input.sha256"
              printf 'run_%s_outputs_sha256:\n' "$run_number"
              cat "$audit_root/run-$run_number-output.sha256"
            done
            printf '\n[case-by-case comparison]\ninput_hashes_match=%s\noutput_hashes_match=%s\ncomplete_18_case_pairs=%s\n' \
              "$input_hashes_match" "$output_hashes_match" "$complete"
          } > "$audit_root/manifest.txt"
          sha256sum "$audit_root/manifest.txt" > "$audit_root/manifest.sha256"
          if [ "$input_hashes_match" != true ] || [ "$output_hashes_match" != true ] || [ "$complete" != true ]; then
            exit 1
          fi
      - name: Upload native synthetic audit artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-synthetic-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-synthetic-audit/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
          include-hidden-files: true
      - name: Verify failed task publishes no artifact pair
        shell: bash
        run: |
          set -o pipefail
          failure_root="$(mktemp -d "$RUNNER_TEMP/chameleon-failure.XXXXXX")"
          failure_input="$failure_root/input"
          failure_output="$failure_root/output"
          mkdir -p "$failure_input" "$failure_output"
          printf '{' > "$failure_input/malformed.json"
          set +e
          docker run --rm --network none \
            -v "$failure_input:/app/input:ro" \
            -v "$failure_output:/app/output" \
            chameleon-stage1 2>&1 | tee "$failure_root/failure.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F "[malformed.json] status=MALFORMED_INPUT" "$failure_root/failure.log"
          test -z "$(find "$failure_output" -mindepth 1 -maxdepth 1 -print -quit)"
      - name: Record native runtime measurements
        shell: bash
        run: |
          set -o pipefail
          qualification_output="$RUNNER_TEMP/chameleon-qualification"
          rm -rf "$qualification_output"
          mkdir -p "$qualification_output"
          set +e
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE/chameleon/input:/app/input:ro" \
            -v "$GITHUB_WORKSPACE/chameleon/output:/app/output" \
            -v "$GITHUB_WORKSPACE/scripts:/qualification-bin:ro" \
            -v "$qualification_output:/qualification-out" \
            --entrypoint python chameleon-stage1 \
            /qualification-bin/qualify_runtime.py \
            --report /qualification-out/runtime.json -- python -m engine.main \
            2>&1 | tee "$RUNNER_TEMP/runtime.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          grep -F "[chameleon_sample_level1_warmup.json] status=SUCCESS" "$RUNNER_TEMP/runtime.log"
          grep -F "[chameleon_sample_level2_core.json] status=SUCCESS" "$RUNNER_TEMP/runtime.log"
          grep -F "[chameleon_sample_level3_advanced.json] status=SUCCESS" "$RUNNER_TEMP/runtime.log"
          test -s "$qualification_output/runtime.json"
          RUNTIME_STATUS="$status" .venv/bin/python - "$qualification_output/runtime.json" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as report_file:
              report = json.load(report_file)
          expected_status = int(os.environ["RUNTIME_STATUS"])
          if report["returncode"] != expected_status:
            raise SystemExit(f"unexpected runtime return code: {report['returncode']}")
          if report["elapsed_seconds"] < 0:
              raise SystemExit("negative elapsed time")
          if report["cpu_seconds"]["user"] < 0 or report["cpu_seconds"]["system"] < 0:
              raise SystemExit("negative CPU time")
          if report["max_rss"]["value"] < 0:
              raise SystemExit("negative RSS")
          thread_count = report["thread_count"]
          if thread_count["source"] != "procfs" or thread_count["peak"] < 1:
              raise SystemExit("missing Linux thread-count measurement")
          if not report["platform"]["machine"]:
              raise SystemExit("missing platform metadata")
          PY
          for path in \
            chameleon/output/chameleon_sample_level1_warmup_output.json \
            chameleon/output/chameleon_sample_level1_warmup_output.png \
            chameleon/output/.chameleon_sample_level1_warmup_output.commit \
            chameleon/output/chameleon_sample_level2_core_output.json \
            chameleon/output/chameleon_sample_level2_core_output.png \
            chameleon/output/.chameleon_sample_level2_core_output.commit \
            chameleon/output/chameleon_sample_level3_advanced_output.json \
            chameleon/output/chameleon_sample_level3_advanced_output.png \
            chameleon/output/.chameleon_sample_level3_advanced_output.commit; do
            test ! -L "$path"
            test -f "$path"
          done
          test -z "$(find chameleon/output -maxdepth 1 -type l -print -quit)"
          cat "$qualification_output/runtime.json"
          docker inspect chameleon-stage1 --format 'image_size_bytes={{.Size}}'

      - name: Verify repeated native artifact hashes
        shell: bash
        run: |
          set -euo pipefail
          artifacts=(
            chameleon/output/chameleon_sample_level1_warmup_output.json
            chameleon/output/chameleon_sample_level1_warmup_output.png
            chameleon/output/.chameleon_sample_level1_warmup_output.commit
            chameleon/output/chameleon_sample_level2_core_output.json
            chameleon/output/chameleon_sample_level2_core_output.png
            chameleon/output/.chameleon_sample_level2_core_output.commit
            chameleon/output/chameleon_sample_level3_advanced_output.json
            chameleon/output/chameleon_sample_level3_advanced_output.png
            chameleon/output/.chameleon_sample_level3_advanced_output.commit
          )
          for artifact in "${artifacts[@]}"; do
            test ! -L "$artifact"
            test -f "$artifact"
          done
          test -z "$(find chameleon/output -maxdepth 1 -type l -print -quit)"
          sha256sum "${artifacts[@]}" | cut -d' ' -f1 > "$RUNNER_TEMP/first-artifacts.sha256"
          make clean
          set +e
          make docker-test 2>&1 | tee "$RUNNER_TEMP/docker-test-repeat.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          grep -F "[chameleon_sample_level1_warmup.json] status=SUCCESS" "$RUNNER_TEMP/docker-test-repeat.log"
          grep -F "[chameleon_sample_level2_core.json] status=SUCCESS" "$RUNNER_TEMP/docker-test-repeat.log"
          grep -F "[chameleon_sample_level3_advanced.json] status=SUCCESS" "$RUNNER_TEMP/docker-test-repeat.log"
          for artifact in "${artifacts[@]}"; do
            test ! -L "$artifact"
            test -f "$artifact"
          done
          test -z "$(find chameleon/output -maxdepth 1 -type l -print -quit)"
          sha256sum "${artifacts[@]}" | cut -d' ' -f1 > "$RUNNER_TEMP/repeat-artifacts.sha256"
          diff -u "$RUNNER_TEMP/first-artifacts.sha256" "$RUNNER_TEMP/repeat-artifacts.sha256"

      - name: Verify clean-cache artifact hashes
        shell: bash
        run: |
          set -euo pipefail
          clean_output="$RUNNER_TEMP/clean-output"
          mkdir -p "$clean_output"
          set +e
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE/chameleon/input:/app/input:ro" \
            -v "$clean_output:/app/output" \
            chameleon-stage1-clean 2>&1 | tee "$RUNNER_TEMP/docker-test-clean.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          grep -F "[chameleon_sample_level1_warmup.json] status=SUCCESS" "$RUNNER_TEMP/docker-test-clean.log"
          grep -F "[chameleon_sample_level2_core.json] status=SUCCESS" "$RUNNER_TEMP/docker-test-clean.log"
          grep -F "[chameleon_sample_level3_advanced.json] status=SUCCESS" "$RUNNER_TEMP/docker-test-clean.log"
          clean_artifacts=(
            "$clean_output/chameleon_sample_level1_warmup_output.json"
            "$clean_output/chameleon_sample_level1_warmup_output.png"
            "$clean_output/.chameleon_sample_level1_warmup_output.commit"
            "$clean_output/chameleon_sample_level2_core_output.json"
            "$clean_output/chameleon_sample_level2_core_output.png"
            "$clean_output/.chameleon_sample_level2_core_output.commit"
            "$clean_output/chameleon_sample_level3_advanced_output.json"
            "$clean_output/chameleon_sample_level3_advanced_output.png"
            "$clean_output/.chameleon_sample_level3_advanced_output.commit"
          )
          for artifact in "${clean_artifacts[@]}"; do
            test ! -L "$artifact"
            test -f "$artifact"
          done
          test -z "$(find "$clean_output" -maxdepth 1 -type l -print -quit)"
          sha256sum "${clean_artifacts[@]}" | cut -d' ' -f1 > "$RUNNER_TEMP/clean-artifacts.sha256"
          diff -u "$RUNNER_TEMP/first-artifacts.sha256" "$RUNNER_TEMP/clean-artifacts.sha256"

      - name: Record native sample artifact hashes
        run: |
          sha256sum \
            chameleon/output/chameleon_sample_level1_warmup_output.json \
            chameleon/output/chameleon_sample_level1_warmup_output.png \
            chameleon/output/chameleon_sample_level2_core_output.json \
            chameleon/output/chameleon_sample_level2_core_output.png \
            chameleon/output/chameleon_sample_level3_advanced_output.json \
            chameleon/output/chameleon_sample_level3_advanced_output.png \
            chameleon/output/.chameleon_sample_level1_warmup_output.commit \
            chameleon/output/.chameleon_sample_level2_core_output.commit \
            chameleon/output/.chameleon_sample_level3_advanced_output.commit

      - name: Verify offline native renderer imports
        run: docker run --rm --network none --entrypoint python chameleon-stage1 -c "import cr_renderer; import skia"
      - name: Record native library closure
        shell: bash
        run: |
          set -euo pipefail
          closure_log="$RUNNER_TEMP/native-library-closure.log"
          docker run --rm --network none --entrypoint sh chameleon-stage1 -c '
            set -eu
            skia_path="$(python -c "import skia; print(skia.__file__)")"
            pillow_path="$(python -c "import PIL._imaging; print(PIL._imaging.__file__)")"
            printf "skia=%s\n" "$skia_path"
            ldd "$skia_path"
            printf "pillow=%s\n" "$pillow_path"
            ldd "$pillow_path"
          ' 2>&1 | tee "$closure_log"
          ! grep -F "not found" "$closure_log"
      - name: Compare native audit hashes and write manifest
        if: always()
        shell: bash
        env:
          NATIVE_AUDIT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          NATIVE_AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONHASHSEED: "0"
          TZ: UTC
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          audit_root="$RUNNER_TEMP/native-synthetic-audit"
          mkdir -p "$audit_root"
          hash_match=true
          complete=true
          for run_number in 1 2; do
            run_root="$audit_root/run-$run_number"
            mkdir -p "$run_root"
            for kind in input output; do
              hash_file="$audit_root/run-$run_number-$kind.sha256"
              if [ -d "$run_root/$kind" ]; then
                (cd "$run_root/$kind" && find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 -r sha256sum) > "$hash_file"
              else
                : > "$hash_file"
                complete=false
              fi
            done
            input_count="$(find "$run_root/input" -maxdepth 1 -type f -name '*.json' -print 2>/dev/null | wc -l | tr -d ' ')"
            json_count="$(find "$run_root/output" -maxdepth 1 -type f -name '*_output.json' -print 2>/dev/null | wc -l | tr -d ' ')"
            png_count="$(find "$run_root/output" -maxdepth 1 -type f -name '*_output.png' -print 2>/dev/null | wc -l | tr -d ' ')"
            marker_count="$(find "$run_root/output" -maxdepth 1 -type f -name '.*_output.commit' -print 2>/dev/null | wc -l | tr -d ' ')"
            if [ "$input_count" != 18 ] || [ "$json_count" != 18 ] || [ "$png_count" != 18 ] || [ "$marker_count" != 18 ]; then
              complete=false
            fi
            printf 'run_%s_input_json=%s\nrun_%s_output_json=%s\nrun_%s_output_png=%s\nrun_%s_commit_markers=%s\n' \
              "$run_number" "$input_count" "$run_number" "$json_count" \
              "$run_number" "$png_count" "$run_number" "$marker_count" \
              >> "$audit_root/file-counts.txt"
          done
          if diff -u "$audit_root/run-1-input.sha256" "$audit_root/run-2-input.sha256" > "$audit_root/input-hash-diff.txt"; then
            input_hashes_match=true
          else
            input_hashes_match=false
            hash_match=false
          fi
          if diff -u "$audit_root/run-1-output.sha256" "$audit_root/run-2-output.sha256" > "$audit_root/output-hash-diff.txt"; then
            output_hashes_match=true
          else
            output_hashes_match=false
            hash_match=false
          fi
          origin_main="$(git rev-parse origin/main 2>/dev/null || printf 'unavailable')"
          {
            printf 'origin_main_commit=%s\n' "$origin_main"
            printf 'base_commit=%s\n' "$NATIVE_AUDIT_BASE_SHA"
            printf 'audit_head_commit=%s\n' "$NATIVE_AUDIT_HEAD_SHA"
            printf 'checkout_commit=%s\n' "$(git rev-parse HEAD 2>/dev/null || printf 'unavailable')"
            printf 'checkout_tree_sha=%s\n' "$(git rev-parse 'HEAD^{tree}' 2>/dev/null || printf 'unavailable')"
            printf 'origin_main_tree_sha=%s\n' "$(git rev-parse 'origin/main^{tree}' 2>/dev/null || printf 'unavailable')"
            printf 'origin_main_chameleon_tree_sha=%s\n' "$(git rev-parse origin/main:chameleon 2>/dev/null || printf 'unavailable')"
            printf 'audited_chameleon_tree_sha=%s\n' "$(git rev-parse HEAD:chameleon 2>/dev/null || printf 'unavailable')"
            printf 'base_chameleon_tree_sha=%s\n' "$(git rev-parse "$NATIVE_AUDIT_BASE_SHA:chameleon" 2>/dev/null || printf 'unavailable')"
            printf '\n[changes from origin/main to audited checkout]\n'
            cat "$audit_root/source-tree-diff.txt" 2>/dev/null || git diff --name-status origin/main HEAD 2>/dev/null || true
            printf '\n[run commands]\n'
            printf 'image_build=make docker-build\n'
            printf 'audit_command=PYTHONHASHSEED=0 TZ=UTC LC_ALL=C.UTF-8 .venv/bin/python scripts/run_synthetic_docker.py (run twice)\n'
            printf 'independent_validation=docker run --rm --network none --platform linux/amd64 --entrypoint python chameleon-stage1 - <validator>\n'
            printf '\n[runner environment]\nPYTHONHASHSEED=%s\nTZ=%s\nLC_ALL=%s\n' \
              "$PYTHONHASHSEED" "$TZ" "$LC_ALL"
            printf '\n[architecture]\nhost=%s\ndocker_daemon=%s\nimage=%s\n' \
              "$(uname -m)" \
              "$(docker info --format '{{.Architecture}}' 2>/dev/null || printf 'unavailable')" \
              "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' chameleon-stage1 2>/dev/null || printf 'unavailable')"
            printf '\n[image digest]\n'
            cat "$audit_root/image-digests.txt" 2>/dev/null || printf 'unavailable\n'
            printf '\n[timings and case validation]\n'
            for run_number in 1 2; do
              printf '\nrun_%s_timing:\n' "$run_number"
              cat "$audit_root/run-$run_number.timing" 2>/dev/null || printf 'unavailable\n'
              printf 'run_%s_runner_summary:\n' "$run_number"
              grep -E 'Engine container wall time:|In-image audit wall time:|Total container wall time:|Engine Docker command:|Audit Docker command:|Task statuses:|Committed JSON/PNG pairs:|In-image serialized responses hard-validated:' \
                "$audit_root/run-$run_number.log" 2>/dev/null || true
              printf 'run_%s_independent_validation:\n' "$run_number"
              cat "$audit_root/run-$run_number-independent-validation.log" 2>/dev/null || printf 'unavailable\n'
            done
            printf '\n[file counts]\n'
            cat "$audit_root/file-counts.txt"
            printf '\n[input and output hashes, relative to each run directory]\n'
            for run_number in 1 2; do
              printf '\nrun_%s_inputs_sha256:\n' "$run_number"
              cat "$audit_root/run-$run_number-input.sha256"
              printf 'run_%s_outputs_sha256:\n' "$run_number"
              cat "$audit_root/run-$run_number-output.sha256"
            done
            printf '\n[case-by-case comparison]\ninput_hashes_match=%s\noutput_hashes_match=%s\ncomplete_18_case_pairs=%s\n' \
              "$input_hashes_match" "$output_hashes_match" "$complete"
          } > "$audit_root/manifest.txt"
          sha256sum "$audit_root/manifest.txt" > "$audit_root/manifest.sha256"
          if [ "$input_hashes_match" != true ] || [ "$output_hashes_match" != true ] || [ "$complete" != true ]; then
            exit 1
          fi
      - name: Upload native synthetic audit artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-synthetic-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-synthetic-audit/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
          include-hidden-files: true
